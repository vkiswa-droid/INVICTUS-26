services:
  - type: web
    name: invictus-2026
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: invictus-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
      - key: ADMIN_SESSION_SECRET
        sync: false

databases:
  - name: invictus-db
    databaseName: invictus
    user: invictus
