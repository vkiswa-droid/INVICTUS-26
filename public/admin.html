<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050611"><title>INVICTUS Admin Dashboard</title><link rel="stylesheet" href="/style.css"></head><body><section class="section admin-section"><div class="admin-head"><div><p class="eyebrow">CONTROL CENTER</p><h2>REGISTRATION <span>DASHBOARD</span></h2><p id="status" class="admin-status">Loading...</p></div><div class="admin-actions"><button id="xlsxBtn" class="btn" type="button">DOWNLOAD EXCEL ↓</button><button id="pdfBtn" class="btn outline" type="button">DOWNLOAD PDF ↓</button><button id="logoutBtn" class="btn ghost" type="button">LOG OUT</button></div></div><div class="table-wrap"><table id="t"><thead><tr><th>ID</th><th>Team</th><th>Leader</th><th>College</th><th>Phone</th><th>Email</th><th>Project</th><th>Action</th></tr></thead><tbody></tbody></table></div></section><div id="editModal" class="modal" aria-hidden="true"><div class="modal-card"><button class="modal-close" id="closeModal" type="button">×</button><p class="eyebrow">EDIT REGISTRATION</p><h3 id="editTitle">Registration</h3><form id="editForm"><input type="hidden" id="editId"><div class="form-grid"><label>Team / Project Name *<input id="e_team" required></label><label>Team Leader *<input id="e_leader" required></label><label>College *<input id="e_college" required></label><label>Department<input id="e_department"></label><label>Year / Semester<input id="e_year"></label><label>Phone *<input id="e_phone" required></label><label>Email *<input id="e_email" type="email" required></label><label>Number of Team Members * <small>(maximum 3)</small><input id="e_members" type="number" min="1" max="3" step="1" required></label><label class="full">Team Member Names<input id="e_memberNames"></label><label class="full">Project Title<input id="e_project"></label><label class="full">Project Description<textarea id="e_abstract" rows="5"></textarea></label></div><button class="btn" type="submit">SAVE CHANGES</button><p id="editMsg"></p></form></div></div><script>
function esc(v){return String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));}
async function api(path,options={}){const r=await fetch(path,{...options,credentials:"same-origin",headers:{...(options.headers||{})}});if(r.status===401){location.href="/admin/login";throw new Error("Session expired");}return r;}
const rowsById=new Map();
function render(rows){rowsById.clear();rows.forEach(x=>rowsById.set(x.id,x));document.getElementById("status").textContent=`${rows.length} registration(s)`;document.querySelector("tbody").innerHTML=rows.map(x=>`<tr><td data-label="ID">${esc(x.id)}</td><td data-label="Team">${esc(x.teamName)}</td><td data-label="Leader">${esc(x.leader)}</td><td data-label="College">${esc(x.college)}</td><td data-label="Phone">${esc(x.phone)}</td><td data-label="Email">${esc(x.email)}</td><td data-label="Project">${esc(x.project||"")}</td><td data-label="Action"><div class="row-actions"><button class="edit-btn" data-id="${esc(x.id)}">EDIT</button><button class="delete-btn" data-id="${esc(x.id)}">DELETE</button></div></td></tr>`).join("");document.querySelectorAll(".edit-btn").forEach(b=>b.addEventListener("click",()=>openEdit(rowsById.get(b.dataset.id))));document.querySelectorAll(".delete-btn").forEach(b=>b.addEventListener("click",()=>deleteRegistration(b.dataset.id)));}
async function load(){try{const r=await api("/api/admin/registrations");const j=await r.json();if(!r.ok)throw new Error(j.message||"Could not load registrations");render(j.registrations);}catch(e){document.getElementById("status").textContent=e.message;}}
async function download(path,filename,button){button.disabled=true;const old=button.textContent;button.textContent="DOWNLOADING...";try{const r=await api(path);if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||"Download failed");}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);}catch(e){alert(e.message);}finally{button.disabled=false;button.textContent=old;}}
async function deleteRegistration(id){const row=rowsById.get(id);const label=row?.teamName?`Team "${row.teamName}" (${id})`:`registration ${id}`;if(!confirm(`Delete ${label}?\n\nThis cannot be undone.`))return;try{const r=await api(`/api/admin/registrations/${encodeURIComponent(id)}`,{method:"DELETE"});const j=await r.json();if(!r.ok)throw new Error(j.message||"Could not delete registration");await load();}catch(e){alert(e.message);}}
function openEdit(x){document.getElementById("editModal").classList.add("open");document.getElementById("editModal").setAttribute("aria-hidden","false");document.getElementById("editId").value=x.id;document.getElementById("editTitle").textContent=x.id;for(const [id,key] of Object.entries({e_team:"teamName",e_leader:"leader",e_college:"college",e_department:"department",e_year:"year",e_phone:"phone",e_email:"email",e_members:"members",e_memberNames:"memberNames",e_project:"project",e_abstract:"abstract"}))document.getElementById(id).value=x[key]||"";document.getElementById("editMsg").textContent="";window.scrollTo({top:0,behavior:"smooth"});}
function closeEdit(){document.getElementById("editModal").classList.remove("open");document.getElementById("editModal").setAttribute("aria-hidden","true");}
document.getElementById("closeModal").onclick=closeEdit;document.getElementById("editModal").addEventListener("click",e=>{if(e.target.id==="editModal")closeEdit()});document.getElementById("logoutBtn").onclick=async()=>{try{await fetch("/api/admin/logout",{method:"POST",credentials:"same-origin"})}finally{location.href="/admin/login"}};document.getElementById("pdfBtn").onclick=e=>download("/api/admin/registrations.pdf",`INVICTUS-2026-registrations-${new Date().toISOString().slice(0,10)}.pdf`,e.currentTarget);document.getElementById("xlsxBtn").onclick=e=>download("/api/admin/registrations.xlsx",`INVICTUS-2026-registrations-${new Date().toISOString().slice(0,10)}.xlsx`,e.currentTarget);
document.getElementById("editForm").addEventListener("submit",async e=>{e.preventDefault();const msg=document.getElementById("editMsg");const id=document.getElementById("editId").value;const body={teamName:document.getElementById("e_team").value,leader:document.getElementById("e_leader").value,college:document.getElementById("e_college").value,department:document.getElementById("e_department").value,year:document.getElementById("e_year").value,phone:document.getElementById("e_phone").value,email:document.getElementById("e_email").value,members:document.getElementById("e_members").value,memberNames:document.getElementById("e_memberNames").value,project:document.getElementById("e_project").value,abstract:document.getElementById("e_abstract").value};msg.textContent="Saving...";try{const r=await api(`/api/admin/registrations/${encodeURIComponent(id)}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.message||"Could not save changes");msg.textContent="Saved successfully.";await load();setTimeout(closeEdit,500);}catch(err){msg.textContent=err.message;}});
fetch("/api/admin/session",{credentials:"same-origin"}).then(r=>{if(!r.ok)throw new Error();load();}).catch(()=>location.href="/admin/login");
</script></body></html>
