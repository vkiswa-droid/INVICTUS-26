<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050611"><title>INVICTUS Admin</title><link rel="stylesheet" href="/style.css"></head><body><section class="section admin-shell"><div class="admin-card"><p class="eyebrow">SECURE ACCESS</p><h2>INVICTUS <span>ADMIN</span></h2><p class="lead small-lead">Sign in to manage registrations.</p><form id="loginForm"><label>Username<input id="u" required autocomplete="username" autocapitalize="none"></label><label>Password<input id="p" type="password" required autocomplete="current-password"></label><button class="btn" type="submit">ENTER DASHBOARD →</button><a class="back-link" href="/">← BACK TO WEBSITE</a><p id="x"></p></form></div></section><script>
(async()=>{try{const r=await fetch("/api/admin/session",{credentials:"same-origin"});if(r.ok)location.href="/admin";}catch{}})();
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const x=document.getElementById("x"),b=e.target.querySelector("button");x.textContent="Signing in...";b.disabled=true;try{const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({username:document.getElementById("u").value.trim(),password:document.getElementById("p").value})});const j=await r.json();if(!r.ok)throw new Error(j.message||"Login failed");location.href="/admin";}catch(err){x.textContent=err.message;}finally{b.disabled=false;}});
</script></body></html>
